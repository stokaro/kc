# Objects screenshots/capture.sh adds to docs/demo/seed.yaml, so that every
# scene has something to show. Small public images only. The broken objects
# are broken on purpose; the comments say what each scene finds.
apiVersion: v1
kind: Namespace
metadata:
  name: staging
---
# catalog gets two more revisions in capture.sh seed (a new image, then a
# new env value), for /rollout and the dashboard's rollout steps.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: shop
  labels:
    app: catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: catalog
          image: busybox:1.36
          command: ["sh", "-c", 'trap "exit 0" TERM; while true; do echo "catalog $MODE ok"; sleep 5; done']
          env:
            - name: MODE
              value: v1
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
---
# loadgen burns CPU for 30 seconds, rests for 30 and holds a buffer, so the
# dashboard has a curve to draw. Its limits put a ceiling over the usage.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  namespace: shop
  labels:
    app: loadgen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: loadgen
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              trap 'exit 0' TERM
              mkdir -p /buf
              while true; do
                end=$(( $(date +%s) + 30 ))
                while [ "$(date +%s)" -lt "$end" ]; do :; done
                head -c 8388608 /dev/zero > /buf/block
                sleep 30
                rm -f /buf/block
              done
          resources:
            requests:
              cpu: 50m
              memory: 16Mi
            limits:
              cpu: 250m
              memory: 64Mi
          volumeMounts:
            - name: buf
              mountPath: /buf
      volumes:
        - name: buf
          emptyDir:
            medium: Memory
---
# The HPA cannot scale: min and max are both 1 (hpa/at-max), and api has
# no CPU limit, which does not matter for a Utilization target.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
---
# The drain confirmation lists the PodDisruptionBudgets that cover the pods.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: shop
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
---
# web may reach api on 8080; api takes ingress from web only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-web
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: web
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-egress
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: web
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: UDP
          port: 53
---
# Broken on purpose: the IngressClass nginx does not exist, and the cart
# Service of the second path does not either.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shop
  namespace: shop
spec:
  ingressClassName: nginx
  rules:
    - host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: cart
                port:
                  number: 80
---
# Broken on purpose: the StorageClass fast-ssd does not exist, so the claim
# stays Pending and so does the pod that uses it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uploads
  namespace: shop
spec:
  storageClassName: fast-ssd
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: uploader
  namespace: shop
  labels:
    app: uploader
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: uploader
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: 10m
          memory: 8Mi
      volumeMounts:
        - name: uploads
          mountPath: /uploads
  volumes:
    - name: uploads
      persistentVolumeClaim:
        claimName: uploads
---
# Broken on purpose: no node has 64 CPUs, so the scheduler leaves it Pending.
apiVersion: v1
kind: Pod
metadata:
  name: bigjob
  namespace: batch
  labels:
    app: bigjob
spec:
  terminationGracePeriodSeconds: 2
  containers:
    - name: bigjob
      image: busybox:1.37
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests:
          cpu: "64"
          memory: 64Mi
---
apiVersion: v1
kind: Secret
metadata:
  name: api-credentials
  namespace: shop
type: Opaque
stringData:
  username: shop-api
  password: not-a-real-password
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-report
  namespace: batch
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.37
              command: ["sh", "-c", "echo report done"]
---
# staging holds copies of the shop Deployments with a few differences, for
# the list compare (C-x d). Zero replicas: only the specs are compared.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: staging
  labels:
    app: web
spec:
  replicas: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: staging
  labels:
    app: api
spec:
  replicas: 0
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: staging
  labels:
    app: search
spec:
  replicas: 0
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search
          image: busybox:1.37
          command: ["sh", "-c", "sleep 3600"]
