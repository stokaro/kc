name: Build binaries

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Download dependencies
        run: go mod download

      - name: Setup envtest
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          ENVTEST_K8S_VERSION: "1.37.x"
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          # A plain assignment carries the command's exit status, so bash -e
          # stops here when setup-envtest fails.
          assets="$(setup-envtest use -p path "${ENVTEST_K8S_VERSION}")"
          echo "KUBEBUILDER_ASSETS=${assets}" >> "$GITHUB_ENV"

      - name: Run tests
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          # envtest suites fail instead of skipping when the control plane
          # cannot start. See docs/adr/0060-require-envtest-in-ci.md.
          KC_REQUIRE_ENVTEST: "1"
        run: go test ./...

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -o "dist/kc-${GOOS}-${GOARCH}" ./cmd/kc

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kc-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error

  release-config:
    name: release config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Check goreleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: check

      - name: Build a snapshot archive
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --skip=sign --single-target

      - name: Smoke test the archive without a kubeconfig
        run: |
          set -eu
          dir="$RUNNER_TEMP/kc-smoke"
          mkdir -p "$dir/home"
          tar -xzf dist/kc_*_linux_amd64.tar.gz -C "$dir"
          env -i HOME="$dir/home" KUBECONFIG="$dir/home/missing" PATH=/usr/bin:/bin "$dir/kc" --version
          env -i HOME="$dir/home" KUBECONFIG="$dir/home/missing" PATH=/usr/bin:/bin "$dir/kc" version --client
