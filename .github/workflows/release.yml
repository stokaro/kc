name: Release

# A v* tag publishes a release. A pull request that touches a file the
# release depends on checks the GoReleaser configuration and builds a
# snapshot, so a broken configuration shows up before the next tag.
# See docs/RELEASING.md and docs/adr/0119-release-pipeline.md.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".goreleaser.yaml"
      - ".github/workflows/release.yml"
      - "cmd/kc/**"
      - "go.mod"
      - "go.sum"
      - "LICENSE"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GORELEASER_VERSION: v2.19.0

jobs:
  check:
    name: goreleaser check and snapshot
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: check

      # --snapshot skips the publish phase: nothing reaches GitHub Releases
      # or the tap, and the tap token is not read.
      - name: Build a snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --snapshot --clean --skip=sign

      # The same check the issue asks of the Homebrew package: the shipped
      # binary reports its version with no kubeconfig and no cluster.
      - name: Run the linux/amd64 archive without a kubeconfig
        run: |
          set -eu
          dir="$RUNNER_TEMP/kc-smoke"
          mkdir -p "$dir/home"
          tar -xzf dist/kc_*_linux_amd64.tar.gz -C "$dir" kc
          offline() {
            env -i HOME="$dir/home" KUBECONFIG="$dir/home/missing" PATH=/usr/bin:/bin \
              "$dir/kc" "$@" > "$dir/out"
            cat "$dir/out"
            grep -q '^kc Version: 0.0.0-SNAPSHOT-' "$dir/out"
          }
          offline --version
          offline version --client

      - name: The generated cask points at stokaro
        run: |
          set -eu
          cask=dist/homebrew/Casks/kc.rb
          cat "$cask"
          grep -q 'https://github.com/stokaro/kc/releases/download/' "$cask"
          if grep -n 'sttts' "$cask"; then
            echo "::error::the cask still names the upstream project"
            exit 1
          fi

  release:
    name: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
    steps:
      # The cask is pushed to stokaro/homebrew-kc as the organization's
      # ptah-publish GitHub App (contents: write), the same app ptah uses for
      # its tap. Its ID and key are the organization variable PUBLISH_APP_ID
      # and secret PUBLISH_APP_KEY, which must be shared with this repository.
      # The token is limited to the tap and lives an hour; this job is capped
      # at 40 minutes. Minting it first means a broken key fails before
      # anything is published.
      - name: Mint a GitHub App token for the tap
        id: app-token
        if: vars.PUBLISH_APP_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PUBLISH_APP_ID }}
          private-key: ${{ secrets.PUBLISH_APP_KEY }}
          owner: stokaro
          repositories: homebrew-kc

      # GoReleaser reaches the tap only after the GitHub Release is published.
      # Without a credential the release would end half done, so stop here
      # first. A HOMEBREW_TAP_GITHUB_TOKEN secret is the fallback when the app
      # is not configured.
      - name: The Homebrew tap credential must be present
        id: tap-token
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          PAT: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          set -eu
          if [ -n "$APP_TOKEN" ]; then
            echo "value=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "the cask is written as the GitHub App"
          elif [ -n "$PAT" ]; then
            echo "::add-mask::$PAT"
            echo "value=$PAT" >> "$GITHUB_OUTPUT"
            echo "the cask is written with HOMEBREW_TAP_GITHUB_TOKEN"
          else
            echo "::error::no tap credential: share the organization variable PUBLISH_APP_ID and secret PUBLISH_APP_KEY with stokaro/kc, or set HOMEBREW_TAP_GITHUB_TOKEN. See docs/RELEASING.md."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Release
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.value }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
