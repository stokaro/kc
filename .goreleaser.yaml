version: 2

project_name: kc

builds:
  - id: kc
    main: ./cmd/kc
    binary: kc
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: kc
    wrap_in_directory: false
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: '{{ .ProjectName }}_checksums.txt'
  algorithm: sha256

signs:
  - id: archive-signatures
    cmd: gpg
    args:
      - --batch
      - --pinentry-mode
      - loopback
      - --passphrase-file
      - '{{ .Env.GPG_PASSPHRASE_FILE }}'
      - --armor
      - --detach-sign
      - --output
      - '${signature}'
      - '${artifact}'
    signature: '${artifact}.asc'
    artifacts: archive
  - id: checksum-signatures
    cmd: gpg
    args:
      - --batch
      - --pinentry-mode
      - loopback
      - --passphrase-file
      - '{{ .Env.GPG_PASSPHRASE_FILE }}'
      - --armor
      - --detach-sign
      - --output
      - '${signature}'
      - '${artifact}'
    signature: '${artifact}.asc'
    artifacts: checksum

release:
  github:
    owner: stokaro
    name: kc
  prerelease: auto

changelog:
  use: git

# The Homebrew tap is stokaro/homebrew-tap (`brew install --cask stokaro/tap/kc`).
# Publishing to it needs the HOMEBREW_TAP_GITHUB_TOKEN secret. Without it the
# cask is generated into dist/ but not pushed, so a release still succeeds
# before the tap exists. See docs/RELEASING.md and docs/adr/0061-publish-fork.md.
homebrew_casks:
  - name: kc
    ids: [kc]
    homepage: https://github.com/stokaro/kc
    description: Two-panel Kubernetes TUI built entirely with AI
    license: Apache-2.0
    directory: Casks
    repository:
      owner: stokaro
      name: homebrew-tap
      branch: main
      token: '{{ envOrDefault "HOMEBREW_TAP_GITHUB_TOKEN" "" }}'
    skip_upload: '{{ if isEnvSet "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    commit_author:
      name: kc release bot
      email: 41898282+github-actions[bot]@users.noreply.github.com
    binaries:
      - kc
    # Release builds without Apple notarization would be refused by
    # Gatekeeper; drop the quarantine flag the download sets. Harmless for
    # notarized builds.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/kc"]
          end

notarize:
  macos:
    - enabled: '{{ and (isEnvSet "MACOS_SIGN_P12") (isEnvSet "MACOS_NOTARY_KEY") }}'
      ids: [kc]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        timeout: 20m
