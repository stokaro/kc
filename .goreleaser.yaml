version: 2

project_name: kc

# The release pipeline is described in docs/RELEASING.md and the decisions
# behind it in docs/adr/0119-release-pipeline.md.

builds:
  - id: kc
    main: ./cmd/kc
    binary: kc
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    # The variables live in package main, so these paths do not contain the
    # module path.
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}

# A snapshot is not a release. Name it after the commit, not after whatever
# tag `git describe` finds (the newest tags come from upstream).
snapshot:
  version_template: '0.0.0-SNAPSHOT-{{ .ShortCommit }}'

archives:
  - id: kc
    wrap_in_directory: false
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: '{{ .ProjectName }}_checksums.txt'
  algorithm: sha256

# Keyless signing with cosign: the release workflow signs the checksum file
# with its GitHub OIDC identity, so there is no signing key to store or
# rotate. Verify with:
#   cosign verify-blob --bundle kc_checksums.txt.sigstore.json kc_checksums.txt \
#     --certificate-identity-regexp '^https://github.com/stokaro/kc/' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - id: checksums
    cmd: cosign
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}
    artifacts: checksum
    output: true

release:
  github:
    owner: stokaro
    name: kc
  prerelease: auto

changelog:
  use: git
  sort: asc

# Homebrew gets a cask only. GoReleaser deprecates `brews`, and `goreleaser
# check` refuses a configuration that has one. The cask also installs on
# Linux. Users run `brew install --cask stokaro/kc/kc`.
homebrew_casks:
  - name: kc
    ids: [kc]
    binaries: [kc]
    homepage: https://github.com/stokaro/kc
    description: Two-panel Kubernetes TUI inspired by Midnight Commander
    license: Apache-2.0
    directory: Casks
    repository:
      owner: stokaro
      name: homebrew-kc
      branch: main
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    # The upload is not optional. The release workflow refuses to start
    # without the token, so a release never finishes green with the tap left
    # behind. Snapshots skip the publish phase, and with it this token.
    skip_upload: false
    commit_author:
      name: github-actions[bot]
      email: 41898282+github-actions[bot]@users.noreply.github.com
    commit_msg_template: 'Update the kc cask to {{ .Tag }}'
    # Builds without Apple notarization would be blocked by Gatekeeper.
    # Remove the quarantine attribute the download sets; it does no harm on a
    # notarized build.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/kc"]
          end

# Runs only when the Apple secrets exist (see docs/RELEASING.md).
notarize:
  macos:
    # Empty, not unset, is what GitHub Actions passes for a missing secret.
    - enabled: '{{ and (ne (envOrDefault "MACOS_SIGN_P12" "") "") (ne (envOrDefault "MACOS_NOTARY_KEY" "") "") }}'
      ids: [kc]
      sign:
        certificate: "{{ .Env.MACOS_SIGN_P12 }}"
        password: "{{ .Env.MACOS_SIGN_PASSWORD }}"
      notarize:
        issuer_id: "{{ .Env.MACOS_NOTARY_ISSUER_ID }}"
        key_id: "{{ .Env.MACOS_NOTARY_KEY_ID }}"
        key: "{{ .Env.MACOS_NOTARY_KEY }}"
        wait: true
        # Apple refuses tokens that live longer; GoReleaser allows at most 20m.
        timeout: 20m
