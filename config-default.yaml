viewer:
  theme: dracula
  mode: scroll

panel:
  scrolling:
    horizontal:
      step: 4
  width:
    leftPercent: 50
    rightPercent: 50

input:
  escTimeout: 1s
  mouse:
    doubleClickTimeout: 300ms

kubernetes:
  clusters:
    ttl: 2m
  discovery:
    refresh: 30s

resources:
  # Default behavior: hide resources with zero objects
  showNonEmptyOnly: true
  # How often to re-peek hidden resources for changes when showNonEmptyOnly is true
  peekInterval: 10s
  # Default ordering: alphabetic by resource plural
  order: alpha
  # Favorites are used when order=favorites; leave empty to follow discovery's "all" category.
  favorites: []

objects:
  # Object list ordering: name | -name | creation | -creation
  order: name
  # Columns mode for server-side Tables:
  # - normal: show priority 0 columns (kubectl default)
  # - wide: show all server-provided columns (like `kubectl get -o wide`)
  columns: normal

# Columns per resource type, keyed by group/version/resource (v1/pods for
# the core group). An entry with jsonPath adds a column computed from the
# object, like `kubectl get -o custom-columns`; wide: true shows it only in
# wide mode. An entry with hide: true hides the server column of that name;
# name "*" hides all server columns except Name. Example:
#
# columns:
#   apps/v1/deployments:
#     - name: IMAGE
#       jsonPath: .spec.template.spec.containers[*].image
#     - name: Up-to-date
#       hide: true
#   v1/pods:
#     - name: NODE-IP
#       jsonPath: .status.hostIP
#       wide: true
columns: {}

commands:
  - name: Top Nodes
    command: kubectl top nodes
    type: global
    location: panel
    watchInterval: 5s
    debounce: 500ms
    onExit: keep-open
  - name: Shell ($SHELL)
    command: $SHELL
    type: global
    location: panel
    interactive: true
    onExit: restore
  - name: Top Pods
    command: kubectl top pods -n {{.Namespace}}
    type: namespace
    location: panel
    watchInterval: 5s
    debounce: 500ms
    onExit: keep-open
