viewer:
  theme: dracula
  mode: scroll

panel:
  scrolling:
    horizontal:
      step: 4
  width:
    leftPercent: 50
    rightPercent: 50
  # Panel colors: a built-in skin (mc, dark) or ~/.kc/skins/<name>.yaml.
  skin: mc

input:
  escTimeout: 1s
  mouse:
    doubleClickTimeout: 300ms

kubernetes:
  clusters:
    ttl: 2m
  discovery:
    refresh: 30s

resources:
  # Default behavior: hide resources with zero objects
  showNonEmptyOnly: true
  # How often to re-peek hidden resources for changes when showNonEmptyOnly is true
  peekInterval: 10s
  # Default ordering: alphabetic by resource plural
  order: alpha
  # Favorites are used when order=favorites; leave empty to follow discovery's "all" category.
  favorites: []

objects:
  # Object list ordering: name | -name | creation | -creation
  order: name
  # Columns mode for server-side Tables:
  # - normal: show priority 0 columns (kubectl default)
  # - wide: show all server-provided columns (like `kubectl get -o wide`)
  columns: normal

commands:
  - name: Top Nodes
    command: kubectl top nodes
    type: global
    location: panel
    watchInterval: 5s
    debounce: 500ms
    onExit: keep-open
  - name: Shell ($SHELL)
    command: $SHELL
    type: global
    location: panel
    interactive: true
    onExit: restore
  - name: Top Pods
    command: kubectl top pods -n {{.Namespace}}
    type: namespace
    location: panel
    watchInterval: 5s
    debounce: 500ms
    onExit: keep-open

# Tint the panel frame and the context label per kubeconfig context. The
# first matching entry wins. match is a name or a glob ("*" and "?"); regex is
# a Go regular expression. Colors: ANSI names (red, bright-cyan), 0-255 or
# #rrggbb. Example:
#   contexts:
#     - match: "*prod*"
#       color: red
#     - regex: "^kind-"
#       color: green
contexts: []
